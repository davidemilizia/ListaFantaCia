<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Listone Fantacalcio</title>
</head>
<body>

    <h1>Listone Calciatori</h1>

    <table id="tabella-listone" border="1">
        <thead>
            <tr>
                <th>Nome</th>
                <th>Squadra</th>
                <th>Costo</th>
            </tr>
        </thead>
        <tbody id="corpo-tabella">
            <!-- I dati verranno caricati qui dinamicamente -->
        </tbody>
    </table>

    <script>
        // Percorso relativo: funzionerà perfettamente su GitHub Pages perché 
        // listone.json si trova nella stessa cartella di index.html
        fetch('listone.json')
            .then(response => {
                if (!response.ok) {
                    throw new Error('Errore nel recupero del file JSON');
                }
                return response.json();
            })
            .then(data => {
                const tbody = document.getElementById('corpo-tabella');
                tbody.innerHTML = ''; 

                // Itera su tutti i calciatori presenti nel JSON
                data.forEach(giocatore => {
                    const tr = document.createElement('tr');
                    
                    tr.innerHTML = `
                        <td>${giocatore.nome}</td>
                        <td>${giocatore.squadra}</td>
                        <td>${giocatore.costo}</td>
                    `;
                    
                    tbody.appendChild(tr);
                });
            })
            .catch(error => console.error('Errore:', error));
    </script>

</body>
</html>
