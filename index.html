<script>
  let dbGiocatori = {};
  let listaNomiGiocatori = [];

  window.onload = function() {
    fetch('listone.json')
      .then(response => {
        if (!response.ok) {
          throw new Error('Errore nel caricamento del file listone.json');
        }
        return response.json();
      })
      .then(data => {
        listaNomiGiocatori = processaDataJson(data);

        // Ordinamento sicuro per evitare crash
        listaNomiGiocatori.sort((a, b) => (a.nome || '').localeCompare(b.nome || ''));

        // Creazione di una chiave univoca per ogni calciatore (Nome + Squadra + Index)
        listaNomiGiocatori.forEach((g, idx) => {
          if (g.nome) {
            // Genera chiave univoca per gestire i casi di omonimia
            const keyUnivoca = `${g.nome.trim()}|||${(g.squadra || '').trim()}|||${idx}`;
            g.key = keyUnivoca;
            
            dbGiocatori[keyUnivoca] = { 
              nome: g.nome.trim(),
              ruolo: g.ruolo || "", 
              squadra: g.squadra || "" 
            };
          }
        });

        caricaTabella();
      })
      .catch(error => {
        console.error('Errore:', error);
        document.getElementById('messaggio').style.color = '#c62828';
        document.getElementById('messaggio').innerText = "Attenzione: Impossibile caricare listone.json (" + error.message + ")";
      });
  };

  function processaDataJson(data) {
    let arrayPiatto = [];
    const mappatura = {
      "portieri": "P",
      "difensori": "D",
      "centrocampisti": "C",
      "attaccanti": "A",
      "allenatori": "ALL"
    };

    if (Array.isArray(data)) {
      return data.map(g => ({
        nome: (g.nome || g.Calciatore || g.NOME || "").toString().trim(),
        squadra: (g.squadra || g.Squadra || g.SQUADRA || "").toString().trim(),
        ruolo: (g.ruolo || g.Ruolo || g.RUOLO || "").toString().trim(),
        costo: g.costo || g.Costo || 1
      }));
    } else if (typeof data === 'object' && data !== null) {
      for (let reparto in data) {
        if (Array.isArray(data[reparto])) {
          let rCode = mappatura[reparto.toLowerCase()] || reparto.toUpperCase();
          data[reparto].forEach(g => {
            arrayPiatto.push({
              nome: (g.nome || g.Calciatore || g.NOME || "").toString().trim(),
              squadra: (g.squadra || g.Squadra || g.SQUADRA || "").toString().trim(),
              ruolo: (g.ruolo || g.Ruolo || g.RUOLO || rCode).toString().trim(),
              costo: g.costo || g.Costo || 1
            });
          });
        }
      }
    }
    return arrayPiatto;
  }

  function caricaTabella() {
    const salvato = localStorage.getItem('fantacalcio_asta_dati');
    const tbody = document.querySelector('#tabellaGiocatori tbody');
    tbody.innerHTML = "";

    if (salvato) {
      try {
        const righeSalvate = JSON.parse(salvato);
        if (righeSalvate && righeSalvate.length > 0) {
          righeSalvate.forEach(r => {
            creaRigaHtml(r.giocatore, r.ruolo, r.squadra, r.fascia, r.maxCrediti, r.minCrediti);
          });
        } else {
          aggiungiRigaPreset();
        }
      } catch (e) {
        aggiungiRigaPreset();
      }
    } else {
      aggiungiRigaPreset();
    }
    aggiornaFiltroTende();
  }

  function salvaDati(mostraMessaggio = false) {
    const righe = document.querySelectorAll('#tabellaGiocatori tbody tr');
    const datiDaSalvare = [];

    righe.forEach(r => {
      const selectGiocatore = r.querySelector('.select-giocatore');
      const selectFascia = r.querySelector('.select-fascia');
      const cols = r.querySelectorAll('td');

      datiDaSalvare.push({
        giocatore: selectGiocatore ? selectGiocatore.value : "",
        ruolo: cols[1] ? cols[1].innerText.trim() : "",
        squadra: cols[2] ? cols[2].innerText.trim() : "",
        fascia: selectFascia ? selectFascia.value : "1",
        maxCrediti: cols[4] ? cols[4].innerText.trim() : "",
        minCrediti: cols[5] ? cols[5].innerText.trim() : ""
      });
    });

    localStorage.setItem('fantacalcio_asta_dati', JSON.stringify(datiDaSalvare));

    if (mostraMessaggio) {
      const msg = document.getElementById('messaggio');
      msg.style.color = '#2e7d32';
      msg.innerText = "Modifiche salvate con successo!";
      setTimeout(() => { msg.innerText = ""; }, 3000);
    }
  }

  function aggiungiRigaPreset() {
    creaRigaHtml("", "", "", "1", "10", "1");
    salvaDati();
  }

  function creaRigaHtml(valoreSelezionato = "", ruolo = "", squadra = "", fascia = "1", max = "10", min = "1") {
    const tbody = document.querySelector('#tabellaGiocatori tbody');
    const nuovaRiga = document.createElement('tr');
    
    nuovaRiga.innerHTML = `
      <td>
        <select class="select-giocatore" onchange="aggiornaDatiGiocatore(this)">
        </select>
      </td>
      <td contenteditable="true" class="center ruolo-cell" oninput="salvaDati()">${ruolo}</td>
      <td contenteditable="true" class="squadra-cell" oninput="salvaDati()">${squadra}</td>
      <td class="center">
        <select class="select-fascia" onchange="salvaDati()">
          <option value="1" ${fascia === "1" ? "selected" : ""}>1</option>
          <option value="2" ${fascia === "2" ? "selected" : ""}>2</option>
          <option value="3" ${fascia === "3" ? "selected" : ""}>3</option>
          <option value="4" ${fascia === "4" ? "selected" : ""}>4</option>
        </select>
      </td>
      <td contenteditable="true" class="right" oninput="salvaDati()">${max}</td>
      <td contenteditable="true" class="right" oninput="salvaDati()">${min}</td>
      <td class="center"><button style="padding: 5px 10px; background-color: #c62828;" onclick="rimuoviRiga(this)">Elimina</button></td>
    `;
    tbody.appendChild(nuovaRiga);
    
    popolaSelectSingola(nuovaRiga.querySelector('.select-giocatore'), valoreSelezionato, squadra);
  }

  function escapeHtml(text) {
    return text.replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function popolaSelectSingola(selectElement, valoreSelezionato, rigaSquadra = "") {
    if (!selectElement) return;
    const filtro = document.getElementById('inputRicerca') ? document.getElementById('inputRicerca').value.toUpperCase().trim() : "";
    let optionsHtml = '<option value="">-- Seleziona Giocatore --</option>';

    listaNomiGiocatori.forEach(g => {
      if (!g.nome) return;
      const nomeUpper = g.nome.toUpperCase();
      const squadraUpper = (g.squadra || "").toUpperCase();
      const nomeMatch = nomeUpper.includes(filtro);
      const squadraMatch = squadraUpper.includes(filtro);
      
      // Confronto sia con la chiave univoca sia con il nome+squadra per i salvataggi vecchi
      const eSelezionato = (g.key === valoreSelezionato) || 
                           (valoreSelezionato.includes(g.nome) && g.squadra === rigaSquadra);

      if (filtro === "" || nomeMatch || squadraMatch || eSelezionato) {
        let selected = eSelezionato ? 'selected' : '';
        let infoSquadra = g.squadra ? ` (${g.squadra}${g.ruolo ? ' - ' + g.ruolo : ''})` : '';
        optionsHtml += `<option value="${escapeHtml(g.key)}" ${selected}>${g.nome}${infoSquadra}</option>`;
      }
    });

    selectElement.innerHTML = optionsHtml;
  }

  function aggiornaFiltroTende() {
    const righe = document.querySelectorAll('#tabellaGiocatori tbody tr');
    righe.forEach(riga => {
      const selectGiocatore = riga.querySelector('.select-giocatore');
      const cellaSquadra = riga.querySelector('.squadra-cell');
      const valoreCorrente = selectGiocatore ? selectGiocatore.value : "";
      const squadraCorrente = cellaSquadra ? cellaSquadra.innerText.trim() : "";
      popolaSelectSingola(selectGiocatore, valoreCorrente, squadraCorrente);
    });
  }

  function rimuoviRiga(bottone) {
    bottone.closest('tr').remove();
    salvaDati();
  }

  function aggiornaDatiGiocatore(selectElement) {
    const keyScelta = selectElement.value;
    const riga = selectElement.closest('tr');
    const cellaRuolo = riga.querySelector('.ruolo-cell');
    const cellaSquadra = riga.querySelector('.squadra-cell');

    if (dbGiocatori[keyScelta]) {
      cellaRuolo.innerText = dbGiocatori[keyScelta].ruolo || "";
      cellaSquadra.innerText = dbGiocatori[keyScelta].squadra || "";
    }
    salvaDati();
  }

  function esportaJson() {
    const righe = document.querySelectorAll('#tabellaGiocatori tbody tr');
    const dati = [];
    righe.forEach(r => {
      const selectGiocatore = r.querySelector('.select-giocatore');
      const selectFascia = r.querySelector('.select-fascia');
      const cols = r.querySelectorAll('td');
      const keyScelta = selectGiocatore ? selectGiocatore.value : "";
      const infoGiocatore = dbGiocatori[keyScelta] || {};

      dati.push({
        giocatore: infoGiocatore.nome || keyScelta,
        ruolo: cols[1] ? cols[1].innerText.trim() : "",
        squadra: cols[2] ? cols[2].innerText.trim() : "",
        fascia: selectFascia ? selectFascia.value : "1",
        maxCrediti: cols[4] ? cols[4].innerText.trim() : "",
        minCrediti: cols[5] ? cols[5].innerText.trim() : ""
      });
    });

    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(dati, null, 2));
    const downloadAnchor = document.createElement('a');
    downloadAnchor.setAttribute("href", dataStr);
    downloadAnchor.setAttribute("download", "lista_fantacalcio_asta.json");
    document.body.appendChild(downloadAnchor);
    downloadAnchor.click();
    downloadAnchor.remove();
  }
</script>
